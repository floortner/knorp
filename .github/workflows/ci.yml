name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint · typecheck · test · build · contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: besserlesenschreiben/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: besserlesenschreiben/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # Contract gate: the committed OpenAPI must match the code.
      - run: npm run openapi:export
      - name: openapi.json is up to date
        run: git diff --exit-code openapi.json

  frontend:
    name: frontend (lint · typecheck · test · build · contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: besserlesenschreiben/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: besserlesenschreiben/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build
      - run: npm test
      # Contract gate: the committed generated types must match the committed OpenAPI.
      - run: npm run gen:api
      - name: api.gen.ts is up to date
        run: git diff --exit-code src/lib/api.gen.ts

  trainer:
    name: trainer (lint · typecheck · test · build · contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: besserlesenschreiben/trainer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: besserlesenschreiben/trainer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build
      - run: npm test
      # Contract gate: the committed generated types must match the committed OpenAPI (/staff/* shipped).
      - run: npm run gen:api
      - name: api.gen.ts is up to date
        run: git diff --exit-code src/lib/api.gen.ts

  # The linguists' feedback loop (ROADMAP §I): every lecture file in content/ is validated against
  # the exercise contract (German errors, emitted as inline PR annotations), and the skill-tag lock
  # keeps taxonomy renames/removals a deliberate two-file change. Runs on every PR — content-only
  # PRs from the linguists rely on exactly this job.
  content:
    name: content (validate lecture files + skill-tag lock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: besserlesenschreiben/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: besserlesenschreiben/backend/package-lock.json
      - run: npm ci
      - run: npm run content:validate

  # NOTE: the end-to-end Playwright suite (e2e/) is intentionally NOT run in CI — run it LOCALLY only
  # (`cd e2e && npm test`). The fast backend/frontend/trainer jobs above (unit + golden + contract
  # gates) are the CI safety net.
