<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#27A99B" />
    <title>besserlesenschreiben</title>
    <!-- Night-mode boot (SPEC §6): resolve the mirrored appearance mode before first paint so
         pre-auth screens are themed and there is no light flash. Kept in sync with
         src/features/settings/theme.ts (key + colors). -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('blsb.appearance');
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark)
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#151d1b');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
